<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold border gradients -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa8214"/>
      <stop offset="100%" stop-color="#fdf0b0"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6708"/>
      <stop offset="50%" stop-color="#edd57e"/>
      <stop offset="100%" stop-color="#fff8cc"/>
    </linearGradient>

    <!-- Ruby facets light/shadow gradients -->
    <!-- Top Ray Light (Left facet) -->
    <linearGradient id="facetTL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a3b"/>
      <stop offset="50%" stop-color="#c80815"/>
      <stop offset="100%" stop-color="#7a0006"/>
    </linearGradient>
    <!-- Top Ray Shadow (Right facet) -->
    <linearGradient id="facetTR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e01020"/>
      <stop offset="60%" stop-color="#930209"/>
      <stop offset="100%" stop-color="#550004"/>
    </linearGradient>

    <!-- Right Top Ray Light -->
    <linearGradient id="facetRTL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="60%" stop-color="#b80512"/>
      <stop offset="100%" stop-color="#6e0007"/>
    </linearGradient>
    <!-- Right Top Ray Shadow -->
    <linearGradient id="facetRTR" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#5a0004"/>
      <stop offset="60%" stop-color="#8a0009"/>
      <stop offset="100%" stop-color="#bb0514"/>
    </linearGradient>

    <!-- Bottom Right Ray Light -->
    <linearGradient id="facetBRL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2435"/>
      <stop offset="60%" stop-color="#a0000a"/>
      <stop offset="100%" stop-color="#550005"/>
    </linearGradient>
    <!-- Bottom Right Ray Shadow -->
    <linearGradient id="facetBRR" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#460003"/>
      <stop offset="50%" stop-color="#780008"/>
      <stop offset="100%" stop-color="#aa000d"/>
    </linearGradient>

    <!-- Bottom Left Ray Light -->
    <linearGradient id="facetBLL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="60%" stop-color="#a8000a"/>
      <stop offset="100%" stop-color="#580005"/>
    </linearGradient>
    <!-- Bottom Left Ray Shadow -->
    <linearGradient id="facetBLR" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4c0004"/>
      <stop offset="50%" stop-color="#800009"/>
      <stop offset="100%" stop-color="#b50512"/>
    </linearGradient>

    <!-- Left Top Ray Light -->
    <linearGradient id="facetLTL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3a4b"/>
      <stop offset="50%" stop-color="#c50816"/>
      <stop offset="100%" stop-color="#700007"/>
    </linearGradient>
    <!-- Left Top Ray Shadow -->
    <linearGradient id="facetLTR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#550004"/>
      <stop offset="60%" stop-color="#90000a"/>
      <stop offset="100%" stop-color="#cc0817"/>
    </linearGradient>

    <!-- Ray texture pattern for Soviet ruby glass engraving -->
    <pattern id="rubyRays" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
    </pattern>

    <!-- Shadow filter -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#starGlow)">
    <!-- Outer Gold Rim -->
    <polygon 
      points="250,15 318,172 488,188 359,301 397,470 250,382 103,470 141,301 12,188 182,172"
      fill="url(#goldRim)"
      stroke="#7c5e0e"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Inner Gold Ridge -->
    <polygon 
      points="250,30 311,173 466,188 348,292 384,446 250,367 116,446 152,292 34,188 189,173"
      fill="url(#goldInner)"
      stroke="#fff3a8"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- Ruby Star Base -->
    <polygon 
      points="250,38 307,174 454,188 342,287 376,434 250,358 124,434 158,287 46,188 193,174"
      fill="#850007"
    />

    <!-- Facets with radial 3D bevels (Center at 250, 275) -->
    <!-- Top point: 250, 38 -->
    <polygon points="250,38 250,275 193,174" fill="url(#facetTL)" />
    <polygon points="250,38 307,174 250,275" fill="url(#facetTR)" />

    <!-- Right top point: 454, 188 -->
    <polygon points="307,174 454,188 250,275" fill="url(#facetRTL)" />
    <polygon points="454,188 342,287 250,275" fill="url(#facetRTR)" />

    <!-- Bottom right point: 376, 434 -->
    <polygon points="342,287 376,434 250,275" fill="url(#facetBRL)" />
    <polygon points="376,434 250,358 250,275" fill="url(#facetBRR)" />

    <!-- Bottom left point: 124, 434 -->
    <polygon points="250,358 124,434 250,275" fill="url(#facetBLL)" />
    <polygon points="124,434 158,287 250,275" fill="url(#facetBLR)" />

    <!-- Left top point: 46, 188 -->
    <polygon points="158,287 46,188 250,275" fill="url(#facetLTL)" />
    <polygon points="46,188 193,174 250,275" fill="url(#facetLTR)" />

    <!-- Fine Guilloche / Ray Pattern Overlay on Ruby Glass -->
    <polygon 
      points="250,38 307,174 454,188 342,287 376,434 250,358 124,434 158,287 46,188 193,174"
      fill="url(#rubyRays)"
      mix-blend-mode="overlay"
      opacity="0.6"
    />

    <!-- Kremlin Star Central Gold Spine Lines -->
    <!-- Center to Top -->
    <line x1="250" y1="275" x2="250" y2="38" stroke="#ffeaa7" stroke-width="2" stroke-linecap="round"/>
    <line x1="250" y1="275" x2="250" y2="38" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
    <!-- Center to Right Top -->
    <line x1="250" y1="275" x2="454" y2="188" stroke="#ffeaa7" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Center to Bottom Right -->
    <line x1="250" y1="275" x2="376" y2="434" stroke="#e0b840" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Center to Bottom Left -->
    <line x1="250" y1="275" x2="124" y2="434" stroke="#e0b840" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Center to Left Top -->
    <line x1="250" y1="275" x2="46" y2="188" stroke="#ffeaa7" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Subtle Central Highlighting -->
    <circle cx="250" cy="275" r="4" fill="#fff" opacity="0.8" />
  </g>
</svg>
