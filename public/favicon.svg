<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="coinFace" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fff1c5"/>
      <stop offset="35%" stop-color="#e4b752"/>
      <stop offset="75%" stop-color="#af7e1d"/>
      <stop offset="100%" stop-color="#69480b"/>
    </radialGradient>
    <linearGradient id="coinRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#4a3106"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Milled Coin Rim -->
  <circle cx="32" cy="32" r="31" fill="url(#coinRim)"/>
  
  <!-- Inner Rim Border -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#ffeaa7" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Coin Field -->
  <circle cx="32" cy="32" r="26.5" fill="url(#coinFace)"/>
  
  <!-- Dotted Relief Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#543c08" stroke-width="0.9" stroke-dasharray="2,1.8" opacity="0.85"/>
  
  <!-- Soviet Ruby Red Star with gold edge -->
  <polygon points="32,10.5 34.2,15.5 39.5,15.8 35.3,19.2 36.7,24.5 32,21.5 27.3,24.5 28.7,19.2 24.5,15.8 29.8,15.5" 
           fill="#d90429" stroke="#ffe8a3" stroke-width="0.6" filter="url(#shadow)"/>
  
  <!-- "15" Denomination - High contrast bold glyphs -->
  <!-- 1 -->
  <path d="M 23 38.5 L 23 27.5 L 20 29.5 L 20 27 L 23.5 24.5 L 26 24.5 L 26 38.5 Z" 
        fill="#2b1a03" filter="url(#shadow)"/>
  <!-- 5 -->
  <path d="M 32 24.5 L 42 24.5 L 42 27.5 L 35 27.5 L 34.5 30.5 C 35.8 29.8 37.5 29.5 39 30.2 C 41.5 31.2 42.5 33.8 42.5 36 C 42.5 39.5 39.8 41.5 36 41.5 C 33.2 41.5 31.2 40.2 30.5 38.5 L 33.2 37 C 33.7 38 34.8 38.8 36.2 38.8 C 38 38.8 39.2 37.8 39.2 36 C 39.2 34.2 38 33.2 36.2 33.2 C 34.5 33.2 33.5 34 33 34.8 L 31.5 34 Z" 
        fill="#2b1a03" filter="url(#shadow)"/>
  
  <!-- Text: КОП -->
  <text x="32" y="52.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" font-size="7.5" fill="#2b1a03" text-anchor="middle" letter-spacing="1.2">КОП</text>
  
  <!-- Laurel / Wheat arcs on sides -->
  <path d="M 10 32 C 10 42 18 51 24 53" fill="none" stroke="#785311" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 54 32 C 54 42 46 51 40 53" fill="none" stroke="#785311" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
</svg>
