<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f5e0b7"/>
      <stop offset="45%" stop-color="#d4af66"/>
      <stop offset="100%" stop-color="#8a6b2d"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8bd"/>
      <stop offset="100%" stop-color="#5a4114"/>
    </linearGradient>
  </defs>
  <!-- Coin outer rim -->
  <circle cx="32" cy="32" r="30" fill="url(#rimGrad)"/>
  <circle cx="32" cy="32" r="27" fill="url(#coinGrad)"/>
  <!-- Inner dotted border -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#684e1b" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Red star at top -->
  <polygon points="32,13 33.8,17.5 38.5,17.8 34.8,20.8 36,25.5 32,22.8 28,25.5 29.2,20.8 25.5,17.8 30.2,17.5" fill="#dc2626"/>
  <!-- Number 15 -->
  <text x="32" y="42" font-family="'Oswald', sans-serif, monospace" font-weight="900" font-size="20" fill="#362507" text-anchor="middle">15</text>
  <!-- Text КОП -->
  <text x="32" y="51" font-family="'Rubik', sans-serif" font-weight="700" font-size="7" fill="#4d370e" text-anchor="middle" letter-spacing="1">КОП</text>
</svg>
